# Daily Lead Scraper
# Runs automatically every day to find new business leads in Adelaide

name: Daily Lead Scrape

on:
  # Run every day at 9 AM Adelaide time (ACDT = UTC+10:30)
  # 9 AM Adelaide = 10:30 PM UTC (previous day)
  schedule:
    - cron: '30 22 * * *'

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without saving (test mode)'
        required: false
        default: 'false'
        type: boolean
      category:
        description: 'Only scrape specific category (leave empty for all)'
        required: false
        default: ''
        type: string

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          CRM_SHEET_ID: ${{ secrets.CRM_SHEET_ID }}
        run: |
          # Build command based on inputs
          CMD="python main.py"

          # Add dry-run flag if specified
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            CMD="$CMD --dry-run"
          fi

          # Add category filter if specified
          if [ -n "${{ github.event.inputs.category }}" ]; then
            CMD="$CMD --category '${{ github.event.inputs.category }}'"
          fi

          echo "Running: $CMD"
          eval $CMD

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-logs-${{ github.run_number }}
          path: |
            *.log
          retention-days: 7
